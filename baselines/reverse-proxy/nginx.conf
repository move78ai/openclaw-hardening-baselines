# Example NGINX reverse proxy snippet.
# Use this ONLY if you must expose OpenClaw remotely, and front it with strong auth (SSO/MFA),
# TLS, IP allowlisting, and ideally a VPN.

server {
  listen 443 ssl http2;
  server_name openclaw.example.com;

  # TLS placeholders
  ssl_certificate     /etc/letsencrypt/live/openclaw.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/openclaw.example.com/privkey.pem;

  # TODO: add auth (SSO/OIDC, basic auth behind VPN, etc.)
  # auth_basic "Restricted";
  # auth_basic_user_file /etc/nginx/.htpasswd;

  location / {
    proxy_pass http://127.0.0.1:18789;  # TODO: adjust to your local bind/port
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
